[build]
  publish = "dist"
  command = "npm run build"

# If this project is inside a GitHub subfolder named "referralfinder",
# set Netlify's Base directory to: referralfinder

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/country/korea"
  to = "/countries/south-korea/"
  status = 301

[[redirects]]
  from = "/check-binance-referral"
  to = "/link-checker/"
  status = 301
